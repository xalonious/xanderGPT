<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ring" x1="110" y1="380" x2="410" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="core" x1="140" y1="140" x2="372" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#1F2AFA"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ring -->
  <path d="M118 310 C150 418 286 464 386 402 C468 352 484 246 416 174"
        fill="none" stroke="url(#ring)" stroke-width="36" stroke-linecap="round"/>

  <!-- X core -->
  <path fill="url(#core)" d="
    M160 176 L176 160 L256 240 L336 160 L352 176 L272 256 L352 336
    L336 352 L256 272 L176 352 L160 336 L240 256 Z"/>

  <!-- spark -->
  <g filter="url(#glow)" opacity="0.9">
    <path d="M414 168 l10 18 l-18-10 l18 10 l-10 18 l10-18 l18 10 l-18-10 Z" fill="#EAF7FF"/>
  </g>
</svg>